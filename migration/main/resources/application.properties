spring.application.name=sharepoint
server.port=${APP_PORT:8080}

# Exception Handling
spring.web.resources.add-mappings=false
spring.mvc.throw-exception-if-no-handler-found=true
server.error.whitelabel.enabled=false

# SpringDoc / Swagger
springdoc.show-hateoas-endpoints=false

# Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{requestId}] [%X{userEmail}] [%X{clientIp}] --- [%t] %-40.40logger{39} : %m%n

# Rate Limiting
security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Microsoft Graph API
graph.base-url=https://graph.microsoft.com/v1.0
graph.tenant-id=${GRAPH_TENANT_ID:}
graph.client-id=${GRAPH_CLIENT_ID:}
graph.client-secret=${GRAPH_CLIENT_SECRET:}

# Migration Writer
writer.batch-size=${WRITER_BATCH_SIZE:500}

# Quartz
spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true
spring.quartz.overwrite-existing-jobs=true

# SQLite
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/sharepoint.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
